[package]
name = "nxview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
cadmpeg-codec-nx.workspace = true
cadmpeg-ir.workspace = true
cadmpeg-tessellate.workspace = true
cfb = "0.15"
glam = "0.34"
serde.workspace = true
serde_json.workspace = true

[dependencies.minifb]
version = "0.29"
optional = true

[dependencies.fontdue]
version = "0.9"
optional = true

[features]
default = []
viewer = ["dep:minifb", "dep:fontdue"]

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
